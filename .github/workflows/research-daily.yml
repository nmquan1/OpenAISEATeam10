name: Fee research (daily)
on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright for code-level quote verification
        run: npx --yes playwright@1.49.1 install --with-deps chromium && npm i --no-save playwright@1.49.1
      - name: Run research engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEAM10_HACKATHON }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "Secret OPENAI_API_KEY_TEAM10_HACKATHON is not set; skipping."; exit 0; fi
          node scripts/research/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fee-candidates
          path: data/fees/candidates/
          if-no-files-found: ignore
