name: Market Maker CI
on:
  push:
    branches: ['main', 'feat/**', 'chore/**', 'docs/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The foundation branch is independently reviewable before UI lands.
      - name: Verify foundation
        run: node --check scripts/serve.mjs && node --check scripts/build.mjs
      - name: Test and package prototype
        if: ${{ hashFiles('src/engine.js') != '' }}
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/index.html') != '' }}
        with:
          name: market-maker-preview
          path: dist/
