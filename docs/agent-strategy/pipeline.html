<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin Guard Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0C1214; --panel:#121B1E; --line:#22343A; --ink:#E4EEF0; --muted:#7E9399;
  --research:#47C6FF; --strategy:#B794FF; --catalog:#F2B33D; --drop:#FF7A93; --out:#5BE39A;
  --font-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);margin:0;letter-spacing:.01em}
.stage{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow-x:auto;display:flex;align-items:center}
svg{display:block;width:100%;min-width:960px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

text{fill:var(--ink)}
.t{font:600 17px var(--font-display);letter-spacing:.02em;text-anchor:middle}
.s{font:400 10.5px var(--font-mono);fill:var(--muted);text-anchor:middle}
.zl{font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.zs{font:400 10.5px var(--font-mono);fill:var(--muted)}
.tag{font:400 10px var(--font-mono);fill:var(--muted)}
.zone{fill:none;stroke-width:1.2;stroke-dasharray:6 6;opacity:.55}
.n{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.r .n{stroke:var(--research)} .c .n{stroke:var(--catalog)} .m .n{stroke:var(--strategy)} .o .n{stroke:var(--out)} .x .n{stroke:var(--drop);stroke-dasharray:4 4}
.p{fill:none;stroke:var(--line);stroke-width:2}
.px{stroke:var(--drop);stroke-dasharray:3 5;opacity:.6}
.node{cursor:pointer}
.node:hover .n,.node:focus-visible .n{fill:var(--panel);stroke-width:2.5}
.node:focus{outline:none}
.node.on .n{fill:var(--panel);stroke-width:3}
.back{position:fixed;inset:0;background:rgba(5,9,10,.55);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s;z-index:5}
.back.show{opacity:1}
.card{position:fixed;z-index:6;left:50%;top:50%;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1.5px solid var(--c,var(--line));border-radius:16px;padding:20px 22px 22px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 40px -8px var(--c,transparent);transform-origin:top left}
.card .top{display:flex;align-items:flex-start;gap:12px}
.card .kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--c)}
.card h2{font:600 1.7rem var(--font-display);margin:2px 0 0}
.x-btn{margin-left:auto;font:500 1rem var(--font-mono);width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.x-btn:hover{border-color:var(--c)}
.flow{display:grid;grid-template-columns:minmax(0,.8fr) 96px minmax(0,1.4fr);gap:0;align-items:stretch;margin-top:16px}
.flow pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font:11.5px/1.55 var(--font-mono);color:var(--ink);height:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.flow .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.flow .col{min-width:0;display:flex;flex-direction:column}
.flow .col pre{flex:1}
.pipe{position:relative;display:flex;align-items:center;justify-content:center}
.pipe::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--line)}
.pipe .core{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:var(--bg);display:grid;place-items:center;font:600 .8rem var(--font-display);color:var(--c);animation:spin 2.4s linear infinite}
.pipe .core::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed var(--c);opacity:.5}
.pipe i{position:absolute;top:calc(50% - 4px);left:8px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:pass 1.6s linear infinite}
.pipe i:nth-of-type(2){animation-delay:.53s}.pipe i:nth-of-type(3){animation-delay:1.06s}
@keyframes pass{0%{left:8px;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:calc(100% - 16px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.84rem;line-height:1.5;color:var(--muted);opacity:0;transform:translateX(-10px);transition:opacity .35s,transform .35s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--c);color:var(--c);font:600 .8rem var(--font-display)}
.steps li.in{opacity:1;transform:none}
.steps li.run::before{background:var(--c);color:var(--bg)}
.steps b{color:var(--ink);font-weight:500}
.reveal{opacity:0;transition:opacity .35s .1s}
.card.open .reveal{opacity:1}
@media (max-width:700px){.flow{grid-template-columns:1fr}.pipe{height:70px}.pipe::before{left:50%;right:auto;top:8px;bottom:8px;width:2px;height:auto}.pipe i{left:calc(50% - 4px);animation-name:passv}}
@keyframes passv{0%{top:8px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pipe i,.pipe .core{animation:none}.steps li{transition:none}}
@media (prefers-reduced-motion:reduce){.pk{display:none}}
</style>
</head>

  </svg>
  </div>
  <div class="legend">
    <span><i style="background:var(--research)"></i>Research · hằng ngày</span>

  <div class="back" id="back" hidden></div>

function clearT(){timers.forEach(clearTimeout);timers=[]}
function show(g){
  const k=g.dataset.k,n=N[k];clearT();from=g;
  nodes.forEach(x=>x.classList.toggle('on',x===g));
  card.style.setProperty('--c',COL[n.z]);
  document.getElementById('kind').textContent=n.k;
  document.getElementById('title').textContent=n.t;
  document.getElementById('in').textContent=n.i;
  document.getElementById('out').textContent=n.o;
  const ol=document.getElementById('steps');
  ol.innerHTML=n.s.map(x=>'<li><span>'+x+'</span></li>').join('');
  back.hidden=false;card.hidden=false;card.classList.remove('open');
  requestAnimationFrame(()=>back.classList.add('show'));
  card.getAnimations().forEach(a=>a.cancel());card.style.transform='none';
  const r=g.getBoundingClientRect(),c=card.getBoundingClientRect();
  const fin=`translate(${-c.width/2}px,${-c.height/2}px)`;
  if(reduce){card.style.transform=fin;card.classList.add('open');[...ol.children].forEach(li=>li.classList.add('in'));return}
  const sx=r.width/c.width,sy=r.height/c.height,dx=r.left-(c.left),dy=r.top-(c.top);
  card.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.4,borderRadius:'10px'},
    {transform:fin,opacity:1,borderRadius:'16px'}
  ],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  card.style.transform=fin;
  timers.push(setTimeout(()=>card.classList.add('open'),300));
  [...ol.children].forEach((li,i)=>{
    timers.push(setTimeout(()=>li.classList.add('in','run'),450+i*260));
    timers.push(setTimeout(()=>li.classList.remove('run'),450+i*260+500));
  });
  document.getElementById('close').focus({preventScroll:true});
}
function hide(){
  if(card.hidden)return;clearT();
  const done=()=>{card.hidden=true;back.hidden=true;nodes.forEach(x=>x.classList.remove('on'));from&&from.focus({preventScroll:true})};
  back.classList.remove('show');
  if(reduce||!from){done();return}
  const r=from.getBoundingClientRect(),cw=card.offsetWidth,ch=card.offsetHeight,bx=innerWidth/2,by=innerHeight/2;
  card.animate([{transform:card.style.transform,opacity:1},{transform:`translate(${r.left-bx}px,${r.top-by}px) scale(${r.width/cw},${r.height/ch})`,opacity:0}],{duration:260,easing:'ease-in',fill:'forwards'}).onfinish=done;
}
nodes.forEach(g=>{
  g.addEventListener('click',()=>show(g));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g)}});
});
back.addEventListener('click',hide);
document.getElementById('close').addEventListener('click',hide);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
</script>
</body>
</html>
